<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій фотоальбом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Мій фотоальбом</h1>
        <p>Подорож мальовничими куточками природи</p>
    </header>

    <main>
        <h2>Галерея фотографій</h2>

        <div class="gallery">
            <div class="photo">
                <img src="images/mountains.jpg" alt="Гори">
                <h3>Величні гори</h3>
            </div>

            <div class="photo">
                <img src="images/forest.jpg" alt="Ліс">
                <h3>Зелений ліс</h3>
            </div>

            <div class="photo">
                <img src="images/sea.jpg" alt="Море">
                <h3>Морське узбережжя</h3>
            </div>

            <div class="photo">
                <img src="images/lake.jpg" alt="Озеро">
                <h3>Гірське озеро</h3>
            </div>

            <div class="photo">
                <img src="images/sunset.jpg" alt="Захід сонця">
                <h3>Захід сонця</h3>
            </div>

            <div class="photo">
                <img src="images/waterfall.jpg" alt="Водоспад">
                <h3>Водоспад</h3>
            </div>
        </div>
    </main>

    <footer>
        <p>Практична робота 1.4 | Git & GitHub</p>
    </footer>
</body>
</html>
